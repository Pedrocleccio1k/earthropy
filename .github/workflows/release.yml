# Ao criar uma tag v* (ex.: v0.1.0), compila para Linux, Windows e macOS,
# publica os binários na Release e gera o latest.json que o botão "Atualizar" lê.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Compilar para todos os sistemas
        env: { CGO_ENABLED: "0" }
        run: |
          set -e
          TAG=${GITHUB_REF_NAME}
          mkdir -p dist
          for t in linux-amd64 linux-arm64 windows-amd64 darwin-amd64 darwin-arm64; do
            GOOS=${t%-*} GOARCH=${t#*-} EXT=$([ "${t%-*}" = windows ] && echo .exe || true)
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w -X main.Version=$TAG -X main.Repo=$GITHUB_REPOSITORY" -o "dist/earthropy-$t$EXT" .
          done
          # manifesto: versão, notas (corpo da tag) e sha256 de cada binário
          NOTES=$(git tag -l --format='%(contents)' "$TAG" | jq -Rs .)
          {
            echo "{\"version\":\"$TAG\",\"notes\":$NOTES,\"assets\":{"
            first=1
            for f in dist/earthropy-*; do
              n=$(basename "$f"); k=${n#earthropy-}; k=${k%.exe}
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              [ $first = 1 ] || echo ","; first=0
              printf '"%s":{"url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s"}' "$k" "$GITHUB_REPOSITORY" "$TAG" "$n" "$sha"
            done
            echo "}}"
          } > dist/latest.json
          cat dist/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
